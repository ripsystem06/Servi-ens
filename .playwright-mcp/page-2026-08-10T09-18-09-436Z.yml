        - heading "Somos comunidad" [level=2] [ref=f668e74]
        - paragraph [ref=f668e75]: Servi-Ens no se trata solamente de tecnología.
        - paragraph [ref=f668e76]: Se trata de las personas detrás de cada servicio. De quien abre su negocio cada mañana. De quien trabaja por su cuenta. De quien está empezando. De quien lleva años ofreciendo su experiencia. Y de quien simplemente necesita encontrar a alguien que pueda ayudarle.
