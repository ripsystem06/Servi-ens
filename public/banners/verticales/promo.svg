<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="accent-v" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="16" fill="url(#bg-v)"/>

  <!-- Decorative circles -->
  <circle cx="320" cy="60" r="100" fill="white" opacity="0.04"/>
  <circle cx="80" cy="480" r="80" fill="white" opacity="0.04"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="5" rx="2.5" fill="url(#accent-v)"/>

  <!-- Megaphone icon -->
  <g transform="translate(140, 90)" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 22 45 L 22 75 L 5 82 L -3 82 A 28 28 0 0 1 -3 38 L 5 38 L 22 45 Z"/>
    <line x1="5" y1="60" x2="5" y2="80"/>
    <path d="M 40 30 A 30 30 0 0 1 40 90"/>
    <path d="M 55 18 A 45 45 0 0 1 55 102"/>
    <path d="M 70 6 A 60 60 0 0 1 70 114"/>
  </g>

  <!-- Divider line -->
  <line x1="100" y1="210" x2="300" y2="210" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Main title -->
  <text x="200" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1">
    <tspan x="200" dy="0">PROMOCIONA</tspan>
    <tspan x="200" dy="36">TU NEGOCIO</tspan>
    <tspan x="200" dy="36">AQUÍ</tspan>
  </text>

  <!-- Subtitle -->
  <text x="200" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#93C5FD" text-anchor="middle" letter-spacing="2">
    CONTÁCTANOS
  </text>

  <!-- CTA badge -->
  <g transform="translate(120, 445)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="white" fill-opacity="0.15"/>
    <text x="80" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="white" text-anchor="middle">publicidad →</text>
  </g>

  <!-- Small text at bottom -->
  <text x="200" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" fill-opacity="0.3" text-anchor="middle" letter-spacing="1">
    ESPACIO PUBLICITARIO
  </text>
</svg>
